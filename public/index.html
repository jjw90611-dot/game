<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>보드게임 모음집</title>
  <meta name="description" content="라이어 게임, 마피아, 그림 맞히기, 러미 타일, 요트 다이스, 오목까지! 휴대폰과 컴퓨터에서 친구들과 함께 즐기는 실시간 보드게임 모음집.">
  <meta name="theme-color" content="#2f4fd9">
  <meta property="og:title" content="보드게임 모음집">
  <meta property="og:description" content="휴대폰과 컴퓨터에서 친구들과 함께 즐기는 실시간 보드게임">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/GmarketSansMedium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/GmarketSansBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/games.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="7" fill="#fff"/><circle cx="11" cy="11" r="2.6" fill="#2f4fd9"/><circle cx="21" cy="11" r="2.6" fill="#ff5a5f"/><circle cx="11" cy="21" r="2.6" fill="#ffb020"/><circle cx="21" cy="21" r="2.6" fill="#1db954"/><circle cx="16" cy="16" r="2.6" fill="#1d2433"/></svg>
      </span>
      <span class="logo-text">보드게임 모음집</span>
    </a>
    <div class="top-right">
      <span class="online" id="online"><i class="dot"></i><b>0</b>명 접속 중</span>
      <button class="me-chip" id="me-chip" type="button" title="닉네임 바꾸기">
        <span class="avatar sm" id="me-avatar"></span><span id="me-name">접속 중…</span><span class="edit" aria-hidden="true">✎</span>
      </button>
    </div>
  </header>
  <div class="conn-banner" id="conn-banner" hidden>서버에 연결하는 중이에요…</div>
  <main id="view"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/js/app.js"></script>
