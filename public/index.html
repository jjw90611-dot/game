<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>보드게임 모음집</title>
  <meta name="description" content="라이어 게임, 마피아, 그림 맞히기, 러미 타일, 요트 다이스, 오목까지! 휴대폰과 컴퓨터에서 친구들과 함께 즐기는 실시간 보드게임 모음집.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="보드게임 모음집">
  <meta property="og:description" content="휴대폰과 컴퓨터에서 친구들과 함께 즐기는 실시간 보드게임">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/GmarketSansMedium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/GmarketSansBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/games.css">
</head>
<body>
  <header class="gnb">
    <div class="gnb-in">
      <a class="logo" href="#/" aria-label="보드게임 모음집 홈">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="8" fill="#0f1a3d"/><rect x="2" y="2" width="28" height="28" rx="8" fill="url(#lg)"/><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d7bff"/><stop offset="1" stop-color="#6b3cff"/></linearGradient></defs><circle cx="11" cy="11" r="2.5" fill="#fff"/><circle cx="21" cy="11" r="2.5" fill="#fff"/><circle cx="16" cy="16" r="2.5" fill="#fff"/><circle cx="11" cy="21" r="2.5" fill="#fff"/><circle cx="21" cy="21" r="2.5" fill="#fff"/></svg>
        </span>
        <span class="logo-text"><b>보드게임 모음집</b><small>BOARD GAME COLLECTION</small></span>
      </a>
      <nav class="gnb-nav" aria-label="주 메뉴">
        <a href="#/" data-nav="home">홈</a>
        <a href="#/games" data-nav="games">전체 게임</a>
        <a href="#/rooms" data-nav="rooms">열린 방</a>
        <a href="#/community" data-nav="community">커뮤니티<i class="nbadge" data-unread hidden></i></a>
      </nav>
      <div class="gnb-right">
        <div class="site-admin-actions" aria-label="잠금 관리">
          <a class="site-admin-link" id="avalon-admin-link" href="/avalon/admin" title="음성·화상 잠금 해제 및 관리">잠금 관리</a>
          <button class="site-lock-btn" id="avalon-lock" type="button" hidden>
            <span data-icon="lock" aria-hidden="true"></span><span id="avalon-lock-label">음성·화상 잠금</span>
          </button>
        </div>
        <span class="online" id="online"><i class="dot"></i><b>0</b>명 접속 중</span>
        <button class="me-chip" id="me-chip" type="button" title="닉네임 바꾸기">
          <span class="avatar sm" id="me-avatar"></span><span id="me-name">접속 중…</span>
        </button>
      </div>
    </div>
  </header>
  <div class="conn-banner" id="conn-banner" hidden>서버에 연결하는 중이에요…</div>
  <div id="media-gate-banner" class="media-gate-banner" role="status" hidden></div>
  <main id="view"></main>
  <footer class="footer" id="footer">
    <div class="footer-in">
      <div class="f-brand"><b>보드게임 모음집</b><span>BOARD GAME COLLECTION</span></div>
      <nav class="f-links"><a href="#/games">전체 게임</a><a href="#/rooms">열린 방</a><a href="#/community">커뮤니티</a><a href="/avalon/">아발론</a><a href="/avalon/admin">잠금 관리</a></nav>
      <p class="f-note">설치 없이 휴대폰과 컴퓨터에서 바로 즐기는 실시간 보드게임. 게임 이름과 그림은 원작과 관계없이 직접 만든 것이에요.</p>
      <p class="f-copy">© 보드게임 모음집 · Powered by Cloudflare Workers</p>
    </div>
  </footer>
  <nav class="tabbar" id="tabbar" aria-label="하단 메뉴">
    <a href="#/" data-nav="home"><span class="ti" data-icon="home"></span>홈</a>
    <a href="#/games" data-nav="games"><span class="ti" data-icon="grid"></span>게임</a>
    <a href="#/rooms" data-nav="rooms"><span class="ti" data-icon="door"></span>열린 방</a>
    <a href="#/community" data-nav="community"><span class="ti" data-icon="chat"></span>커뮤니티<i class="nbadge" data-unread hidden></i></a>
  </nav>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
