# 보드게임 모음집 - Cloudflare Workers 설정
name = "boardgame-collection"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 정적 파일(HTML/CSS/JS/폰트)
[assets]
directory = "./public"
binding = "ASSETS"

# 실시간 멀티플레이 서버 (Durable Object)
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[observability]
enabled = true
